name: FirstCI

jobs:
  deploy:
    runs-on: ubuntu
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Start HTTP server
      run: |
        python3 -m http.server 8080 &
        sleep 3
  test:
    runs-on: ubuntu
    
    steps:
    - name: Test app at port 8080
      run: |
        curl -f http://localhost:8080 || exit 1
        echo "✓ App is running successfully at port 8080"
    
    - name: Test static assets
      run: |
        curl -f http://localhost:8080/script.js || exit 1
        curl -f http://localhost:8080/styles.css || exit 1
        echo "✓ All static assets are accessible"
